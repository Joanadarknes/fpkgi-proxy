<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="PS4 Games Database - Base de dados completa com 17,000+ jogos PS4">
    <meta name="theme-color" content="#0f3460">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <title>🎮 PS4 Games Database</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --bg-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --bg-secondary: rgba(255, 255, 255, 0.08);
            --bg-card: rgba(255, 255, 255, 0.12);
            --bg-card-hover: rgba(255, 255, 255, 0.18);
            --accent: #00f5ff;
            --accent-secondary: #ff6b9d;
            --accent-hover: #00d4e5;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.75);
            --border: rgba(255, 255, 255, 0.15);
            --success: #4ade80;
            --warning: #fbbf24;
            --shadow-light: rgba(0, 245, 255, 0.15);
            --shadow-primary: rgba(0, 0, 0, 0.25);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
        }
        
        body {
            font-family: 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            font-size: 18px;
            position: relative;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3), transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 107, 157, 0.3), transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(0, 245, 255, 0.2), transparent 50%);
            z-index: -2;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Ccircle cx='30' cy='30' r='1'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            z-index: -1;
        }
        
        /* Header */
        .header {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            padding: 25px 40px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        .header-content {
            max-width: 1800px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 30px;
        }
        
        .logo {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 15px;
            text-shadow: 0 2px 10px rgba(0, 245, 255, 0.3);
        }
        
        .logo-icon {
            font-size: 48px;
            filter: drop-shadow(0 0 10px var(--accent));
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }
        
        .stats {
            display: flex;
            gap: 40px;
        }
        
        .stat {
            text-align: center;
            padding: 15px 25px;
            background: var(--glass-bg);
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .stat:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--shadow-light);
        }
        
        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: var(--accent);
            text-shadow: 0 2px 8px rgba(0, 245, 255, 0.3);
        }
        
        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
        }
        
        /* Search */
        .search-input {
            width: 100%;
            padding: 20px 25px 20px 55px;
            font-size: 18px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 2px solid var(--glass-border);
            border-radius: 50px;
            color: var(--text-primary);
            outline: none;
            transition: all 0.3s ease;
            position: relative;
        }

        .search-container {
            flex: 1;
            max-width: 600px;
            position: relative;
        }

        .search-container::before {
            content: '🔍';
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            color: var(--text-secondary);
            z-index: 1;
        }
        
        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 30px rgba(0, 245, 255, 0.4);
            transform: translateY(-2px);
        }
        
        .search-input::placeholder {
            color: var(--text-secondary);
        }
        
        /* Main content */
        .main {
            max-width: 1800px;
            margin: 0 auto;
            padding: 20px 40px 100px;
        }
        
        /* Loading */
        .loading {
            text-align: center;
            padding: 120px 20px;
        }
        
        .loading-spinner {
            width: 80px;
            height: 80px;
            border: 4px solid var(--glass-border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 30px;
            box-shadow: 0 0 30px var(--shadow-light);
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-text {
            font-size: 24px;
            color: var(--text-primary);
            font-weight: 500;
            text-shadow: 0 2px 10px rgba(0, 245, 255, 0.3);
        }
        
        .loading-progress {
            width: 400px;
            height: 12px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 25px;
            margin: 30px auto;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }
        
        .loading-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent-secondary));
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 25px;
            box-shadow: 0 0 20px var(--shadow-light);
        }
        
        /* Letter sections */
        .letter-section {
            margin-bottom: 50px;
        }
        
        .letter-header {
            font-size: 42px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            padding: 20px 0;
            border-bottom: 2px solid var(--glass-border);
            margin-bottom: 25px;
            position: sticky;
            top: 100px;
            background-color: rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(20px);
            z-index: 50;
            text-shadow: 0 4px 15px rgba(0, 245, 255, 0.3);
        }
        
        /* Games grid */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 25px;
            padding: 10px 0;
        }
        
        /* Game card */
        .game-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 28px;
            border: 1px solid var(--glass-border);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .game-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s ease;
        }

        .game-card:hover::before {
            left: 100%;
        }
        
        .game-card:hover,
        .game-card.focused {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--accent);
            box-shadow: 0 20px 60px var(--shadow-light);
            background: var(--bg-card-hover);
        }
        
        .game-title {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 18px;
            color: var(--text-primary);
            line-height: 1.3;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 1;
        }
        
        .game-links {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .download-btn {
            padding: 14px 24px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .download-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .download-btn:hover::before {
            left: 100%;
        }
        
        .btn-mediafire {
            background: linear-gradient(135deg, #1e88e5, #1565c0);
            color: white;
        }
        
        .btn-mediafire:hover {
            background: linear-gradient(135deg, #1565c0, #0d47a1);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(30, 136, 229, 0.4);
        }
        
        .btn-1file {
            background: linear-gradient(135deg, #43a047, #2e7d32);
            color: white;
        }
        
        .btn-1file:hover {
            background: linear-gradient(135deg, #2e7d32, #1b5e20);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(67, 160, 71, 0.4);
        }
        
        .btn-other {
            background: linear-gradient(135deg, #fb8c00, #e65100);
            color: white;
        }
        
        .btn-other:hover {
            background: linear-gradient(135deg, #e65100, #bf360c);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(251, 140, 0, 0.4);
        }
        
        .btn-page {
            background: linear-gradient(135deg, #6c757d, #495057);
            color: white;
        }
        
        .btn-page:hover {
            background: linear-gradient(135deg, #495057, #343a40);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(108, 117, 125, 0.4);
        }

        .btn-pkg {
            background: linear-gradient(135deg, #8e44ad, #9b59b6);
            color: white;
        }

        .btn-pkg:hover {
            background: linear-gradient(135deg, #7d3c98, #8e44ad);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(142, 68, 173, 0.4);
        }

        .game-info {
            font-size: 12px;
            color: var(--text-secondary);
            margin: 5px 0;
            opacity: 0.8;
        }

        .game-cover {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        
        .link-count {
            font-size: 12px;
            opacity: 0.8;
        }
        
        /* Alphabet nav */
        .alphabet-nav {
            position: fixed;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 200;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            padding: 15px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px var(--shadow-primary);
        }
        
        .alphabet-link {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 700;
            color: var(--text-secondary);
            text-decoration: none;
            border-radius: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .alphabet-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--accent);
            opacity: 0;
            transition: all 0.3s ease;
            border-radius: 12px;
        }
        
        .alphabet-link:hover::before,
        .alphabet-link.active::before {
            opacity: 1;
        }
        
        .alphabet-link:hover,
        .alphabet-link.active {
            color: var(--bg-primary);
            transform: scale(1.1);
            text-shadow: none;
        }
        
        /* Scroll to top */
        .scroll-top {
            position: fixed;
            bottom: 30px;
            right: 80px;
            width: 65px;
            height: 65px;
            background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 200;
            box-shadow: 0 8px 25px var(--shadow-light);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        
        .scroll-top.visible {
            opacity: 1;
            visibility: visible;
        }
        
        .scroll-top:hover {
            transform: scale(1.15) rotate(360deg);
            box-shadow: 0 15px 40px var(--shadow-light);
        }
        
        /* Footer */
        .footer {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--glass-border);
            padding: 40px;
            text-align: center;
            color: var(--text-secondary);
            margin-top: 80px;
        }
        
        .footer p {
            margin: 8px 0;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
        }
        
        /* No results */
        .no-results {
            text-align: center;
            padding: 80px 20px;
        }
        
        .no-results-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        
        .no-results-text {
            font-size: 24px;
            color: var(--text-secondary);
        }
        
        /* Search info */
        .search-info {
            text-align: center;
            padding: 20px;
            color: var(--text-secondary);
            font-size: 18px;
        }
        
        /* Controller hint */
        #controller-hint {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.85);
            color: var(--accent);
            padding: 15px 25px;
            border-radius: 12px;
            font-size: 16px;
            z-index: 10000;
            border: 1px solid var(--accent);
            backdrop-filter: blur(10px);
        }
        
        /* Responsive for smaller screens */
        @media (max-width: 1200px) {
            .alphabet-nav {
                display: none;
            }
            
            .games-grid {
                grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
                gap: 20px;
            }

            .scroll-top {
                right: 30px;
                width: 55px;
                height: 55px;
                font-size: 20px;
            }
        }
        
        @media (max-width: 768px) {
            .header {
                padding: 20px;
            }
            
            .header-content {
                flex-direction: column;
                gap: 25px;
            }
            
            .logo {
                font-size: 28px;
            }
            
            .logo-icon {
                font-size: 40px;
            }
            
            .stats {
                gap: 30px;
                justify-content: center;
                flex-wrap: wrap;
            }
            
            .stat {
                padding: 12px 20px;
                min-width: 120px;
            }
            
            .main {
                padding: 20px;
            }

            .games-grid {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                gap: 15px;
            }

            .game-card {
                padding: 20px;
            }

            .search-input {
                padding: 18px 22px 18px 50px;
                font-size: 16px;
            }

            .search-container::before {
                left: 18px;
                font-size: 16px;
            }

            .letter-header {
                font-size: 32px;
                padding: 15px 0;
            }
        }

        @media (max-width: 480px) {
            .header {
                padding: 15px;
            }
            
            .stats {
                gap: 15px;
            }
            
            .stat {
                padding: 10px 15px;
                min-width: 100px;
            }
            
            .stat-value {
                font-size: 24px;
            }
            
            .games-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <span class="logo-icon">🎮</span>
                <span>PS4 Games Database</span>
            </div>
            
            <div class="search-container">
                <input type="text" id="searchInput" class="search-input" 
                       placeholder="Buscar jogos... (△ no controle)">
            </div>
            
            <div class="stats">
                <div class="stat">
                    <div class="stat-value" id="totalGames">0</div>
                    <div class="stat-label">Jogos</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="totalLinks">0</div>
                    <div class="stat-label">Links</div>
                </div>
            </div>
        </div>
    </header>
    
    <!-- Main content -->
    <main class="main">
        <div id="searchInfo" class="search-info"></div>
        <div id="gamesContainer">
            <div class="loading">
                <div class="loading-spinner"></div>
                <div class="loading-text">Carregando base de dados...</div>
                <div class="loading-progress">
                    <div class="loading-progress-bar" id="progressBar"></div>
                </div>
            </div>
        </div>
    </main>
    
    <!-- Alphabet navigation -->
    <nav class="alphabet-nav" id="alphabetNav"></nav>
    
    <!-- Scroll to top button -->
    <button class="scroll-top" id="scrollTop" onclick="scrollToTop()">↑</button>
    
    <!-- Footer -->
    <footer class="footer">
        <p><strong>PS4 Games Database</strong> | Apenas metadados públicos</p>
        <p>Use as setas ou controle para navegar | △ Buscar | ○ Topo | X Selecionar</p>
    </footer>
    
    <script src="gamepad-controller.js"></script>
    <script>
        // Global state
        let allGames = [];
        let filteredGames = [];
        let currentLetter = '';
        
        // Sample games data (will be replaced by actual data)
        const sampleGames = [
            { name: "God of War", letter: "G", links: { mediafire: 3, "1file": 2, other: 1 }, page_url: "#" },
            { name: "Spider-Man", letter: "S", links: { mediafire: 4, "1file": 3, other: 2 }, page_url: "#" },
            { name: "The Last of Us Part II", letter: "T", links: { mediafire: 5, "1file": 4, other: 3 }, page_url: "#" },
            { name: "Horizon Zero Dawn", letter: "H", links: { mediafire: 3, "1file": 2, other: 1 }, page_url: "#" },
            { name: "Uncharted 4", letter: "U", links: { mediafire: 4, "1file": 3, other: 2 }, page_url: "#" },
            { name: "Bloodborne", letter: "B", links: { mediafire: 3, "1file": 2, other: 1 }, page_url: "#" },
            { name: "Final Fantasy VII Remake", letter: "F", links: { mediafire: 5, "1file": 4, other: 3 }, page_url: "#" },
            { name: "Ghost of Tsushima", letter: "G", links: { mediafire: 4, "1file": 3, other: 2 }, page_url: "#" },
            { name: "Persona 5 Royal", letter: "P", links: { mediafire: 3, "1file": 2, other: 1 }, page_url: "#" },
            { name: "Death Stranding", letter: "D", links: { mediafire: 4, "1file": 3, other: 2 }, page_url: "#" },
            { name: "Sekiro: Shadows Die Twice", letter: "S", links: { mediafire: 3, "1file": 2, other: 1 }, page_url: "#" },
            { name: "Resident Evil 2 Remake", letter: "R", links: { mediafire: 4, "1file": 3, other: 2 }, page_url: "#" },
            { name: "Monster Hunter World", letter: "M", links: { mediafire: 5, "1file": 4, other: 3 }, page_url: "#" },
            { name: "Call of Duty: Modern Warfare", letter: "C", links: { mediafire: 4, "1file": 3, other: 2 }, page_url: "#" },
            { name: "Assassin's Creed Valhalla", letter: "A", links: { mediafire: 5, "1file": 4, other: 3 }, page_url: "#" },
            { name: "Cyberpunk 2077", letter: "C", links: { mediafire: 4, "1file": 3, other: 2 }, page_url: "#" },
            { name: "Dark Souls III", letter: "D", links: { mediafire: 3, "1file": 2, other: 1 }, page_url: "#" },
            { name: "NieR: Automata", letter: "N", links: { mediafire: 4, "1file": 3, other: 2 }, page_url: "#" },
            { name: "Kingdom Hearts III", letter: "K", links: { mediafire: 3, "1file": 2, other: 1 }, page_url: "#" },
            { name: "Batman: Arkham Knight", letter: "B", links: { mediafire: 4, "1file": 3, other: 2 }, page_url: "#" }
        ];
        
        // Initialize
        document.addEventListener('DOMContentLoaded', init);
        
        function convertFPKGiToGameList(fpkgiData) {
            const games = [];
            
            for (const [url, gameInfo] of Object.entries(fpkgiData)) {
                const game = {
                    name: gameInfo.name || 'Jogo Desconhecido',
                    letter: (gameInfo.name || 'X').charAt(0).toUpperCase(),
                    links: {
                        pkg: 1 // Tem pelo menos um link PKG
                    },
                    pkg_url: url,
                    title_id: gameInfo.title_id || '',
                    region: gameInfo.region || '',
                    version: gameInfo.version || '',
                    size: gameInfo.size || 0,
                    min_fw: gameInfo.min_fw || '',
                    cover_url: gameInfo.cover_url || '',
                    page_url: url
                };
                
                games.push(game);
            }
            
            return games;
        }
        
        async function init() {
            // Register service worker
            if ('serviceWorker' in navigator) {
                try {
                    await navigator.serviceWorker.register('./service-worker.js');
                    console.log('Service Worker registered');
                } catch (err) {
                    console.log('Service Worker registration failed:', err);
                }
            }
            
            // Load games
            await loadGames();
            
            // Setup search
            document.getElementById('searchInput').addEventListener('input', debounce(searchGames, 300));
            
            // Setup scroll listener
            window.addEventListener('scroll', handleScroll);
            
            // Build alphabet nav
            buildAlphabetNav();
        }
        
        async function loadGames() {
            const progressBar = document.getElementById('progressBar');
            
            // URLs do servidor local
            const urls = [
                'http://localhost:8080/GAMES.json',
                'http://192.168.15.6:8080/GAMES.json',
                './GAMES_format.json'
            ];
            
            let loaded = false;
            
            for (const url of urls) {
                try {
                    console.log('Carregando de:', url);
                    const response = await fetch(url);
                    
                    if (response.ok) {
                        const data = await response.json();
                        
                        // Converter formato do FPKGi para formato da interface
                        if (data.DATA) {
                            allGames = convertFPKGiToGameList(data.DATA);
                        } else {
                            allGames = data;
                        }
                        
                        console.log('Carregados', allGames.length, 'jogos de', url);
                        loaded = true;
                        break;
                    }
                } catch (error) {
                    console.log('Failed to load from', url, ':', error.message);
                }
            }
            
            if (!loaded) {
                console.log('Using sample data as fallback');
                allGames = sampleGames;
            }
            
            progressBar.style.width = '100%';
            
            // Process games
            filteredGames = allGames;
            
            // Update stats
            updateStats();
            
            // Display games
            displayGames(allGames);
        }
        
        function updateStats() {
            const totalGames = allGames.length;
            let totalLinks = 0;
            
            allGames.forEach(game => {
                // Support both formats: download_links (from JSON) and links (sample data)
                if (game.download_links) {
                    totalLinks += (game.download_links.mediafire?.length || 0);
                    totalLinks += (game.download_links['1file']?.length || 0);
                    totalLinks += (game.download_links.other?.length || 0);
                } else if (game.links) {
                    totalLinks += (game.links.mediafire || 0);
                    totalLinks += (game.links['1file'] || 0);
                    totalLinks += (game.links.other || 0);
                } else if (game.total_links) {
                    totalLinks += game.total_links;
                }
            });
            
            document.getElementById('totalGames').textContent = totalGames.toLocaleString();
            document.getElementById('totalLinks').textContent = totalLinks.toLocaleString();
        }
        
        function displayGames(games) {
            const container = document.getElementById('gamesContainer');
            const searchInfo = document.getElementById('searchInfo');
            
            if (games.length === 0) {
                container.innerHTML = `
                    <div class="no-results">
                        <div class="no-results-icon">🔍</div>
                        <div class="no-results-text">Nenhum jogo encontrado</div>
                    </div>
                `;
                searchInfo.textContent = '';
                return;
            }
            
            searchInfo.textContent = `Exibindo ${games.length.toLocaleString()} jogos`;
            
            // Group by letter
            const grouped = {};
            games.forEach(game => {
                const letter = (game.letter || game.name.charAt(0)).toUpperCase();
                if (!grouped[letter]) grouped[letter] = [];
                grouped[letter].push(game);
            });
            
            // Sort letters
            const letters = Object.keys(grouped).sort();
            
            // Build HTML
            let html = '';
            letters.forEach(letter => {
                html += `
                    <section class="letter-section" id="letter-${letter}">
                        <h2 class="letter-header">${letter}</h2>
                        <div class="games-grid">
                            ${grouped[letter].map(game => createGameCard(game)).join('')}
                        </div>
                    </section>
                `;
            });
            
            container.innerHTML = html;
        }
        
        function createGameCard(game) {
            // Suporte para formato FPKGi (PKG) e formato original de links
            const downloadLinks = game.download_links || {};
            const links = game.links || {};
            
            const mediafireLinks = downloadLinks.mediafire || [];
            const onefileLinks = downloadLinks['1file'] || [];
            const otherLinks = downloadLinks.other || [];
            
            const mediafireCount = mediafireLinks.length || links.mediafire || 0;
            const onefileCount = onefileLinks.length || links['1file'] || 0;
            const otherCount = otherLinks.length || links.other || 0;
            const pkgCount = links.pkg || 0;
            
            let buttonsHtml = '';
            
            // Link PKG (formato FPKGi)
            if (game.pkg_url) {
                const sizeText = game.size ? ` (${formatFileSize(game.size)})` : '';
                const regionText = game.region ? ` [${game.region}]` : '';
                buttonsHtml += `
                    <a href="${game.pkg_url}" class="download-btn btn-pkg" target="_blank">
                        📦 PKG${regionText}${sizeText}
                    </a>
                `;
            }
            
            if (mediafireCount > 0) {
                const firstLink = mediafireLinks[0] || game.page_url || '#';
                buttonsHtml += `
                    <a href="${firstLink}" class="download-btn btn-mediafire" target="_blank">
                        📥 Mediafire <span class="link-count">(${mediafireCount})</span>
                    </a>
                `;
            }
            
            if (onefileCount > 0) {
                const firstLink = onefileLinks[0] || game.page_url || '#';
                buttonsHtml += `
                    <a href="${firstLink}" class="download-btn btn-1file" target="_blank">
                        📁 1File <span class="link-count">(${onefileCount})</span>
                    </a>
                `;
            }
            
            if (otherCount > 0) {
                const firstLink = otherLinks[0] || game.page_url || '#';
                buttonsHtml += `
                    <a href="${firstLink}" class="download-btn btn-other" target="_blank">
                        🔗 Outros <span class="link-count">(${otherCount})</span>
                    </a>
                `;
            }
            
            // Informações adicionais do jogo
            let gameInfo = '';
            if (game.title_id) {
                gameInfo += `<div class="game-info">ID: ${game.title_id}</div>`;
            }
            if (game.version) {
                gameInfo += `<div class="game-info">Versão: ${game.version}</div>`;
            }
            if (game.min_fw) {
                gameInfo += `<div class="game-info">FW Min: ${game.min_fw}</div>`;
            }
            
            return `
                <div class="game-card">
                    ${game.cover_url ? `<img src="${game.cover_url}" alt="${game.name}" class="game-cover" loading="lazy">` : ''}
                    <h3 class="game-title">${game.name}</h3>
                    ${gameInfo}
                    <div class="game-links">
                        ${buttonsHtml}
                    </div>
                </div>
            `;
        }
        
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
        
        function searchGames() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            
            if (!query) {
                filteredGames = allGames;
            } else {
                filteredGames = allGames.filter(game => 
                    game.name.toLowerCase().includes(query)
                );
            }
            
            displayGames(filteredGames);
        }
        
        function buildAlphabetNav() {
            const nav = document.getElementById('alphabetNav');
            const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ#'.split('');
            
            nav.innerHTML = letters.map(letter => `
                <a href="#letter-${letter}" class="alphabet-link" data-letter="${letter}">${letter}</a>
            `).join('');
            
            // Add click handlers
            nav.querySelectorAll('.alphabet-link').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const target = document.getElementById(`letter-${link.dataset.letter}`);
                    if (target) {
                        target.scrollIntoView({ behavior: 'smooth' });
                    }
                });
            });
        }
        
        function handleScroll() {
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            const scrollTopBtn = document.getElementById('scrollTop');
            
            // Show/hide scroll to top button
            if (scrollTop > 500) {
                scrollTopBtn.classList.add('visible');
            } else {
                scrollTopBtn.classList.remove('visible');
            }
            
            // Update active letter in nav
            updateActiveLetterNav();
        }
        
        function updateActiveLetterNav() {
            const sections = document.querySelectorAll('.letter-section');
            const navLinks = document.querySelectorAll('.alphabet-link');
            
            let currentSection = '';
            
            sections.forEach(section => {
                const rect = section.getBoundingClientRect();
                if (rect.top <= 150) {
                    currentSection = section.id.replace('letter-', '');
                }
            });
            
            navLinks.forEach(link => {
                if (link.dataset.letter === currentSection) {
                    link.classList.add('active');
                } else {
                    link.classList.remove('active');
                }
            });
        }
        
        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        
        // Utility functions
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
